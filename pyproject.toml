[project]
name = "karak"
version = "0.1.0"
description = "Automated mineralogy pipeline for SEM-EDS elemental map stacks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.15.1",
    "hdbscan>=0.8.41",
    "imageio>=2.37.2",
    "matplotlib>=3.10.8",
    "medpy>=0.5.2",
    "numpy>=2.4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.14.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "rich>=13.0",
]

[project.scripts]
karak = "karak.cli.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karak"]
